[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/corgi"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.88"

[workspace.dependencies]
hc-proto = { path = "crates/hc-proto" }
corgi-vt = { path = "crates/corgi-vt" }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = "0.30"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"

[profile.release]
# Thin LTO with parallel codegen: release builds about twice as fast as fat LTO with one
# codegen unit, for a binary a little larger (a terminal UI doesn't feel the difference).
lto = "thin"
codegen-units = 16
strip = true

# Debug builds of corgi itself, optimized dependencies: ratatui's diff, crossterm and
# tokio run every frame, and unoptimized they make `cargo run` feel sluggish.
[profile.dev.package."*"]
opt-level = 3
