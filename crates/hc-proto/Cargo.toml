[package]
name = "hc-proto"
description = "herdr-core client: framing, JSON-RPC, attach streams, events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "process", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
corgi-vt.workspace = true

[lints]
workspace = true
